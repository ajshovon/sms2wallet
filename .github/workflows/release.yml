name: Release

on:
  push:
    # Tag the commit you want to ship, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist, e.g. v0.1.0)'
        required: true

# Needed to create the GitHub Release and upload the APK to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # :app depends on the :bd-sms-parsers submodule; without this the build fails at
          # settings.gradle.kts with the "submodule is not initialised" guard.
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      # AGP 8.13.2 rejects JDK 25 (it fails with a bare, unhelpful version string), and 17 is
      # the floor. 21 is what this project is verified against locally.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # Gate the release on green tests: a tag should never produce a shipped APK that the
      # suite would have rejected.
      - name: Run tests
        run: ./gradlew :bd-sms-parsers:test :app:testDebugUnitTest

      # Decoded outside the workspace (RUNNER_TEMP) so the keystore can never be picked up by
      # an artifact upload or a stray `git add`.
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - refusing to publish an unsigned APK."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Proves the APK really is signed with the expected key. Without this a misconfigured
      # secret would publish an APK that no phone will install, and nobody would find out until
      # a user tried it.
      - name: Verify signature
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee signing.txt
          EXPECTED='${{ secrets.RELEASE_CERT_SHA256 }}'
          if [ -n "$EXPECTED" ]; then
            ACTUAL="$(grep -m1 'certificate SHA-256 digest' signing.txt | awk '{print $NF}')"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK signed with unexpected certificate: $ACTUAL (expected $EXPECTED)"
              exit 1
            fi
            echo "Certificate matches the expected release key."
          fi

      - name: Stage the APK under a versioned name
        id: stage
        run: |
          TAG='${{ github.event.inputs.tag || github.ref_name }}'
          NAME="sms2wallet-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.name }}
